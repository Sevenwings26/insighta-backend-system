name: Insighta API CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insighta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ENVIRONMENT: production
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REDIRECT_URI: http://127.0.0.1:8000/auth/github/callback
      PYTHONPATH: . 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint & Syntax Check
        run: |
          # This ensures the code is actually runnable without needing pytest
          python -m compileall .

      # --- DEPLOYMENT STEP (Example for Render) ---
      # Only runs if the branch is 'development'
      - name: Deploy to Production
        if: github.ref == 'refs/heads/development' && github.event_name == 'push'
        run: |
          echo "Triggering deployment hook..."
         